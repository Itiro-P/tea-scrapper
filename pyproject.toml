[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tea-analysis"
version = "0.1.0"
description = "Análise da coleta de apps da Google Play (funil, saturação, amostra para rotulagem)"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "pandas>=2.0", "numpy>=1.24"]

[project.scripts]
tea-analysis = "tea_analysis.cli:cli"

[tool.setuptools]
packages = ["tea_analysis"]
